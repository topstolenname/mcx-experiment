[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcx-experiment"
version = "0.1.0"
description = "Reference experiment for Meta-Concord v0.4 authorization."
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcx-experiment = "mcx_experiment.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
