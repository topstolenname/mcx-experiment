[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcx-experiment"
version = "0.1.0"
description = "Reference experiment for Meta-Concord v0.4 authorization."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
readme = "README.md"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcx-experiment = "mcx_experiment.run:main"
mcx-scenario = "mcx_experiment.scenario:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcx_experiment = ["scenarios/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
